[package]
name = "hark-native-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "In-process Hark native shell service. No WebView required."

[dependencies]
hark-core = { path = "../../../crates/hark-core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "hark-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hark R1 in-process core: directory grants, safe reader, SQLite business writer"
license = "UNLICENSED"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
jsonschema = "0.29"
tempfile = "3"

name: CI

# Skip the whole pipeline when a change cannot affect the build: documentation,
# evidence images and top-level markdown. The verify job installs Chromium with
# system packages and runs the full E2E suite, which costs minutes of runner
# time and tells a docs-only change nothing.
#
# `paths-ignore` only skips when EVERY changed path matches, so a mixed
# docs+code change still runs in full.
#
# There is no branch protection and no required status check on this repository,
# so a skipped run cannot leave a pull request waiting for a check that will
# never report. If required checks are ever enabled, this filter must be
# revisited: a required check that is skipped stays "Expected" forever.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'handoff/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'handoff/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 / deterministic checks and Mock E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      HEARTH_ANALYSIS_PROVIDER: mock
      HEARTH_PI_BIN: /nonexistent/live-provider-disabled
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Set up pnpm 11
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
          run_install: false
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and integration tests
        run: pnpm test
      - name: Build web and server
        run: pnpm build
      - name: Install Chromium and browser system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Controlled Mock browser tests
        run: pnpm test:e2e

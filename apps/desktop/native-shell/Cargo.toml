[package]
name = "hark-native-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "In-process Hark native shell service. No WebView required."

[features]
# Experimental only; no product entry point enables this feature.
reviewed-sender = ["dep:sha2", "dep:rustls", "dep:webpki-roots", "dep:httparse"]
# Isolated approval/transport composition; enables the experimental Core v5.
# Never enable against a user database until migration and rollback are ready.
reviewed-integration = ["reviewed-sender", "hark-core/outbound-review"]

[dependencies]
hark-core = { path = "../../../crates/hark-core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
httparse = { version = "1", optional = true }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
